[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backtest-harness"
version = "0.1.0"
description = "Event-driven backtesting engine with high-fidelity fee modeling and Monte Carlo simulations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0"
]
