[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict-backtest"
version = "0.1.0"
description = "Monte-Carlo simulation engine for LLM routing strategy validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nicholas Carter"}]
keywords = ["llm", "routing", "backtest", "monte-carlo", "simulation", "quant"]
dependencies = [
    "numpy>=1.24,<2.3",
    "numba>=0.60; python_version >= '3.12'",
    "numba>=0.58; python_version < '3.12'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "build", "twine", "code-review-graph>=2.3.7"]
viz = ["matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_harness"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]
